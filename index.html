<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
main{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--sub)}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.card{height:min(58vh,380px);height:min(58dvh,380px);min-height:240px;width:100%;border:1px solid var(--line);border-radius:16px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;box-shadow:0 8px 24px rgba(80,40,120,.08);transition:transform .18s ease,background .2s ease}
.card.turning{transform:rotateY(90deg)}.card.showback{background:var(--back)}.kanji{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-weight:500;line-height:1.25;overflow-wrap:anywhere;color:var(--kanji)}.read{font-size:clamp(25px,7vw,34px);font-weight:500;overflow-wrap:anywhere}.tr{font-size:clamp(20px,5vw,25px);color:var(--accent);overflow-wrap:anywhere}.pos{font-size:14px;color:var(--sub)}.hint{font-size:13px;color:var(--sub);text-align:center}.row{display:flex;gap:10px}button{flex:1;font:inherit;font-size:16px;padding:12px 10px;min-height:46px;touch-action:manipulation;-webkit-appearance:none;appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;cursor:pointer}button:active{background:var(--back)}button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button.sm{font-size:13px;padding:9px 8px}select{font:inherit;font-size:15px;padding:8px;max-width:58%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#21152f;--card:#30203f;--back:#3a2850;--ink:#f5edff;--sub:#c5b2d8;--accent:#c5a0ff;--line:#59436f;--kanji:#76e58b}}
@media(prefers-reduced-motion:reduce){.card,.bar i{transition:none}}
</style>
</head>

function fontSize(text){var n=Array.from(text).length;return n<=2?96:n<=4?64:n<=6?44:32}
function render(){var item=deck[index];kanji.hidden=isBack;readEl.hidden=!isBack;trEl.hidden=!isBack;posEl.hidden=!isBack;kanji.textContent=item[0];kanji.style.fontSize=fontSize(item[0])+"px";readEl.textContent=item[1];trEl.textContent=item[3];posEl.textContent=item[2];hint.textContent=isBack?"Oldingi tomonga qaytish uchun bosing":"Javobni ko'rish uchun kartani bosing";card.classList.toggle("showback",isBack);document.getElementById("count").textContent=(index+1)+" / "+deck.length;document.getElementById("fill").style.width=((index+1)/deck.length*100)+"%";}
function flip(){card.classList.add("turning");window.setTimeout(function(){isBack=!isBack;render();card.classList.remove("turning")},90)}
function go(delta){index=(index+delta+deck.length)%deck.length;isBack=false;render()}
function reset(){deck=sets[currentSet].slice();index=0;isBack=false;render()}
card.addEventListener("click",flip);card.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();flip()}});

document.getElementById("setsel").addEventListener("change",function(){currentSet=this.value;reset()});

document.getElementById("shuf").addEventListener("click",function(){for(var k=deck.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var temp=deck[k];deck[k]=deck[j];deck[j]=temp}index=0;isBack=false;render()});
document.addEventListener("keydown",function(e){if(e.key==="ArrowRight"){go(1)}else if(e.key==="ArrowLeft"){go(-1)}else if(e.key===" "&&e.target.tagName!=="BUTTON"&&e.target.tagName!=="SELECT"){e.preventDefault();flip()}});
