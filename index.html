.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}

.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);border-radius:14px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;text-align:center}
.back{transform:rotateY(180deg);background:var(--back)}

.hint{font-size:13px;color:var(--sub)}

.tr{font-size:22px;color:var(--accent)}
.pos{font-size:13px;color:var(--sub)}

select{font:inherit;font-size:16px;padding:8px;max-width:58%;-webkit-appearance:auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px}

@media (prefers-reduced-motion:reduce){.inner,.bar i{transition:none}}

var sets={"1":set1,"2":set2,"all":set1.concat(set2)};
var cur="all",deck,i=0,sc=document.getElementById('scene');
function load(name){
  cur=name;deck=sets[name].slice();i=0;
  try{var s=parseInt(localStorage.getItem('kanji_i_'+cur),10);if(s>=0&&s<deck.length)i=s}catch(e){}
}
try{var c=localStorage.getItem('kanji_set');if(c&&sets[c])cur=c}catch(e){}
document.getElementById('setsel').value=cur;
load(cur);
function sz(t){var n=t.length;return n<=2?96:n<=4?64:n<=6?44:32}
function render(){
  var d=deck[i],f=document.getElementById('front');
  f.textContent=d[0];f.style.fontSize=sz(d[0])+'px';
  document.getElementById('read').textContent=d[1];
  document.getElementById('pos').textContent=d[2];
  document.getElementById('tr').textContent=d[3];
  document.getElementById('count').textContent=(i+1)+' / '+deck.length;
  document.getElementById('fill').style.width=((i+1)/deck.length*100)+'%';
  try{localStorage.setItem('kanji_i_'+cur,i);localStorage.setItem('kanji_set',cur)}catch(e){}
}
function go(n){
  var was=sc.classList.contains('flip');
  sc.classList.remove('flip');
  i=(i+n+deck.length)%deck.length;
  if(was){setTimeout(render,220)}else{render()}
}
function flip(){sc.classList.toggle('flip')}
sc.addEventListener('click',flip);
document.getElementById('next').onclick=function(){go(1)};
document.getElementById('prev').onclick=function(){go(-1)};
document.getElementById('setsel').onchange=function(){sc.classList.remove('flip');load(this.value);render()};
document.getElementById('reset').onclick=function(){deck=sets[cur].slice();i=0;sc.classList.remove('flip');render()};
document.getElementById('shuf').onclick=function(){
  for(var k=deck.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=deck[k];deck[k]=deck[j];deck[j]=t}
  i=0;sc.classList.remove('flip');render();
};
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight')go(1);
  else if(e.key==='ArrowLeft')go(-1);
  else if(e.key===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();flip()}
});
render();
</script>

var sets={"1":set1,"2":set2,"all":set1.concat(set2)};
var cur="all",deck,i=0,sc=document.getElementById('scene');
function load(name){
  cur=name;deck=sets[name].slice();i=0;
  try{var s=parseInt(localStorage.getItem('kanji_i_'+cur),10);if(s>=0&&s<deck.length)i=s}catch(e){}
}
try{var c=localStorage.getItem('kanji_set');if(c&&sets[c])cur=c}catch(e){}
document.getElementById('setsel').value=cur;
load(cur);
function sz(t){var n=t.length;return n<=2?96:n<=4?64:n<=6?44:32}
function render(){
  var d=deck[i],f=document.getElementById('front');
  f.textContent=d[0];f.style.fontSize=sz(d[0])+'px';
  document.getElementById('read').textContent=d[1];
  document.getElementById('pos').textContent=d[2];
  document.getElementById('tr').textContent=d[3];
  document.getElementById('count').textContent=(i+1)+' / '+deck.length;
  document.getElementById('fill').style.width=((i+1)/deck.length*100)+'%';
  try{localStorage.setItem('kanji_i_'+cur,i);localStorage.setItem('kanji_set',cur)}catch(e){}
}
function go(n){
  var was=sc.classList.contains('flip');
  sc.classList.remove('flip');
  i=(i+n+deck.length)%deck.length;
  if(was){setTimeout(render,220)}else{render()}
}
function flip(){sc.classList.toggle('flip')}
sc.addEventListener('click',flip);
document.getElementById('next').onclick=function(){go(1)};
document.getElementById('prev').onclick=function(){go(-1)};
document.getElementById('setsel').onchange=function(){sc.classList.remove('flip');load(this.value);render()};
document.getElementById('reset').onclick=function(){deck=sets[cur].slice();i=0;sc.classList.remove('flip');render()};
document.getElementById('shuf').onclick=function(){
  for(var k=deck.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=deck[k];deck[k]=deck[j];deck[j]=t}
  i=0;sc.classList.remove('flip');render();
};
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight')go(1);
  else if(e.key==='ArrowLeft')go(-1);
  else if(e.key===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();flip()}
});
render();
